name: build page

# 修改页面源码 / 构建脚本 / 配置后，自动重新构建 device/www/index.html
# 构建结果和源码不一致时，由 bot 自动提交回来（提交信息带 [skip ci]，不会再触发一次）

on:
  push:
    branches: [main]
    paths:
      - "src/dashboard.html"
      - "tools/build.py"
      - "tools/vendor/**"
      - "device/config.sh"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-page-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip qrcode

      - name: Build device/www/index.html
        run: python tools/build.py

      - name: Sanity check build output
        run: |
          python - <<'PY'
          import io, os, sys
          p = "device/www/index.html"
          assert os.path.exists(p), "build produced no file"
          s = io.open(p, encoding="utf-8").read()
          assert len(s) > 100_000, "suspiciously small output: %d chars" % len(s)
          for token in ("__LUNAR__", "__QR__", "__TOPIC__"):
              assert token not in s, "placeholder left in output: " + token
          assert "<script src=\"data.js\"></script>" in s, "data.js hook missing"
          print("ok: %d chars" % len(s))
          PY

      - name: Commit rebuilt page
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add device/www/index.html
          if git diff --cached --quiet; then
            echo "page is already up to date, nothing to commit"
          else
            git commit -m "chore: rebuild page [skip ci]"
            git push
          fi
